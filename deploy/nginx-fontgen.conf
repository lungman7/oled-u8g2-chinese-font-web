# 放在既有 server 區塊內，讓外部使用 /fontgen/ 存取獨立服務。
location = /fontgen {
    # 直接以公網 IP 開啟時會落在 HTTP；完整本機字型 API 必須使用 HTTPS。
    if ($http_cf_ray = "") {
        return 302 https://crew-addition-occurs-everybody.trycloudflare.com/fontgen/;
    }
    return 301 /fontgen/;
}

location /fontgen/ {
    # Cloudflare Quick Tunnel 本身也回到此 Nginx，但 Host 不同，因此不會迴圈。
    if ($http_cf_ray = "") {
        return 302 https://crew-addition-occurs-everybody.trycloudflare.com$request_uri;
    }
    proxy_pass http://127.0.0.1:8082/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /fontgen;
    client_max_body_size 8m;
}
